    <link rel="stylesheet" href="style.css">
</head>
<body class="write-page">

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand brand-name" href="home.html">unsent.</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link " href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="write.html">Write a Letter</a>
                    </li>
<li class="nav-item">
    <a class="nav-link" href="journal.html">Journal</a>
</li>
                    <li class="nav-item">
                        <a class="nav-link" href="letter.html">My Letters</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

<main class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-4">Let it out.</h1>
        <p class="lead text-secondary">
            Write what you wish you could say. This letter is just for you.
        </p>
    </div>

    <div class="card border-0 shadow-sm p-4 mx-auto" style="max-width: 750px;">
        <div class="mb-3">
            <label for="letterTo" class="form-label">Who is this letter for?</label>
            <input type="text" class="form-control" id="letterTo"
                   placeholder="Someone, yourself, or no one...">
        </div>

        <div class="mb-3">
            <label for="letterTitle" class="form-label">Give your letter a title</label>
            <input type="text" class="form-control" id="letterTitle"
                   placeholder="A title for your thoughts...">
        </div>

        <div class="mb-4">
            <label for="letterContent" class="form-label">Your letter</label>
            <textarea class="form-control" id="letterContent" rows="10"
                      placeholder="Start writing..."></textarea>
        </div>

        <button class="btn btn-dark align-self-start" type="button" id="saveLetter">
            Save Letter
        </button>
    </div>
</main>




    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    ></script>

</body>
